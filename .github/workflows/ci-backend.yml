name: CI - Quiz API (Backend)

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
    paths:
      - 'quiz-api/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'quiz-api/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Java & Test Classes
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run Tests (Unit & Property-based)
        run: ./gradlew test --no-daemon

      - name: Generate JaCoCo Code Coverage Report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: quiz-api/build/reports/tests/test/
          retention-days: 7

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: quiz-api/build/reports/jacoco/test/
          retention-days: 7
